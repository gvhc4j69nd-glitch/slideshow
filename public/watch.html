<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Watch a slideshow — Vinboo</title>
  <meta name="description" content="Enter the share code and temporary password from whoever is presenting, and this screen follows their slideshow. No account and no app needed.">
  <link rel="canonical" href="https://vinboo.com/watch">

  <meta name="theme-color" content="#FFFAF5">

  <meta property="og:site_name" content="Vinboo">
  <meta property="og:url" content="https://vinboo.com/watch">
  <meta property="og:title" content="Watch a slideshow — Vinboo">
  <meta property="og:description" content="Enter the share code and temporary password from whoever is presenting, and this screen follows their slideshow. No account needed.">
  <meta property="og:image" content="https://vinboo.com/brand/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Vinboo — one slideshow. Every screen. Anywhere.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Watch a slideshow — Vinboo">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXF25X6BPJ"></script>

  <script src="/device.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/brand/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/brand/icon-180.png">
</head>
<body>

  <!-- ── Join with the code and temporary password ────────────────────────── -->
  <main id="join" class="screen gate">
    <form class="gate-card" id="joinForm">
      <img class="gate-logo" src="/brand/wordmark.png" alt="Vinboo" width="900" height="309">
      <h1>Watch a slideshow</h1>
      <p class="dialog-help">
        Enter the share code and temporary password from whoever is presenting.
        You don't need an account.
      </p>

      <label class="stack">
        <span>Share code</span>
        <input type="text" id="joinCode" autocomplete="off" autocapitalize="characters"
               spellcheck="false" placeholder="ABC123" required>
      </label>

      <label class="stack">
        <span>Temporary password</span>
        <input type="text" id="joinPass" autocomplete="off" autocapitalize="characters"
               spellcheck="false" placeholder="ABCD-EFGH-JKMN" required>
      </label>

      <p class="dialog-error" id="joinError" hidden></p>
      <button type="submit" class="btn btn-primary" id="joinSubmit">Watch</button>

      <p class="gate-foot">Presenting instead? <a href="/">Sign in</a>.</p>
      <p class="gate-foot">vinboo.com</p>
    </form>
  </main>

  <!-- ── Mirror of whatever the presenter is showing ──────────────────────── -->
  <section id="viewer" class="screen" hidden aria-label="Shared slideshow">
    <div class="stage" id="stage">
      <img class="slide" id="slideA" alt="">
      <img class="slide" id="slideB" alt="">
      <div class="stage-msg" id="stageMsg">Waiting for the first photo…</div>
    </div>

    <div class="controls" id="controls">
      <div class="controls-left">
        <button type="button" class="btn btn-icon" id="leaveBtn" title="Leave">✕</button>
        <span class="meta">
          <strong id="viewTitle">—</strong>
          <span class="counter-row">
            <span id="viewCounter" class="counter">0 / 0</span>
            <span class="badge badge-sm" id="viewStatus">Connecting…</span>
          </span>
        </span>
      </div>
      <!-- Only for a handed-off show. While a presenter is driving, this screen
           follows them and has nothing of its own to decide. -->
      <div class="controls-mid" id="viewControls" hidden>
        <button type="button" class="btn btn-icon" id="viewPrevBtn" title="Previous (←)">◂◂</button>
        <button type="button" class="btn btn-icon btn-primary" id="viewPlayBtn"
                title="Pause (Space)" aria-pressed="true">❚❚</button>
        <button type="button" class="btn btn-icon" id="viewNextBtn" title="Next (→)">▸▸</button>
        <button type="button" class="btn btn-icon" id="viewRestartBtn" title="Start over (R)">↺</button>
        <label class="field speed">
          <span>Speed</span>
          <select id="viewSpeed" aria-label="Seconds per slide">
            <option value="2000">2s</option>
            <option value="3000">3s</option>
            <option value="5000">5s</option>
            <option value="8000">8s</option>
            <option value="15000">15s</option>
            <option value="30000">30s</option>
          </select>
        </label>
      </div>

      <div class="controls-right">
        <span class="field" id="viewHost"></span>
        <button type="button" class="btn btn-icon" id="viewFullscreenBtn" title="Fullscreen (F)">⛶</button>
      </div>
    </div>
  </section>

  <script src="/watch.js"></script>
</body>
</html>
