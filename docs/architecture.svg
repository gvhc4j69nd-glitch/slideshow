<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950"
     font-family="ui-rounded, 'SF Pro Rounded', Nunito, 'Segoe UI', Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow-media" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C8362F"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1F7884"/>
    </marker>
    <marker id="arrow-auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#936A10"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect x="0" y="0" width="1200" height="950" fill="#FFFAF5"/>

  <text x="600" y="44" text-anchor="middle" font-size="27" font-weight="700" fill="#2A2440">How Vinboo works</text>
  <text x="600" y="72" text-anchor="middle" font-size="14.5" fill="#6B6480">
    The slideshow lives on the presenter's device. The server passes bytes along; it never keeps them.
  </text>

  <!-- ── Presenter ───────────────────────────────────────────────────────── -->
  <rect x="40" y="104" width="270" height="330" rx="18" fill="#FFFFFF" stroke="rgba(42,36,64,.12)"/>
  <rect x="40" y="104" width="270" height="5" rx="2.5" fill="#FF8382"/>
  <text x="62" y="138" font-size="16" font-weight="700" fill="#2A2440">Presenter's browser</text>
  <text x="62" y="158" font-size="12.5" fill="#6B6480">phone · laptop · tablet</text>

  <rect x="62" y="174" width="226" height="46" rx="10" fill="#FFEDEC"/>
  <text x="76" y="193" font-size="12.5" font-weight="600" fill="#C8362F">Photos and .pptx files</text>
  <text x="76" y="210" font-size="11.5" fill="#C8362F">read straight off the device</text>

  <text x="62" y="244" font-size="12" fill="#2A2440">• Renders PowerPoint into SVG slides</text>
  <text x="62" y="264" font-size="12" fill="#2A2440">• Holds the playlist and running order</text>
  <text x="62" y="284" font-size="12" fill="#2A2440">• Answers requests for single slides</text>

  <rect x="62" y="302" width="226" height="64" rx="10" fill="#FFF4DE"/>
  <text x="76" y="322" font-size="12" font-weight="600" fill="#936A10">Must stay open and awake</text>
  <text x="76" y="339" font-size="11.5" fill="#936A10">It is the only copy of the pictures,</text>
  <text x="76" y="355" font-size="11.5" fill="#936A10">so if it closes the screens go quiet.</text>

  <text x="62" y="392" font-size="11.5" fill="#6B6480">Everything here happens in the browser:</text>
  <text x="62" y="408" font-size="11.5" fill="#6B6480">files are read locally, and a .pptx is</text>
  <text x="62" y="424" font-size="11.5" fill="#6B6480">unzipped and drawn with no round trip.</text>

  <!-- ── Server ──────────────────────────────────────────────────────────── -->
  <rect x="460" y="104" width="270" height="330" rx="18" fill="#FFFFFF" stroke="rgba(42,36,64,.12)"/>
  <rect x="460" y="104" width="270" height="5" rx="2.5" fill="#51D1E3"/>
  <text x="482" y="138" font-size="16" font-weight="700" fill="#2A2440">Vinboo server</text>
  <text x="482" y="158" font-size="12" fill="#6B6480">Node · HTTP/1.1 behind Railway's TLS edge</text>

  <text x="482" y="186" font-size="12" fill="#2A2440">• Accounts, sign-in, sessions</text>
  <text x="482" y="206" font-size="12" fill="#2A2440">• Issues share codes and passwords</text>
  <text x="482" y="226" font-size="12" fill="#2A2440">• Parks each viewer's request for a slide</text>
  <text x="482" y="246" font-size="12" fill="#2A2440">• Hands it on, relays the reply back</text>

  <rect x="482" y="264" width="226" height="82" rx="10" fill="#E4F8FB"/>
  <text x="496" y="284" font-size="12" font-weight="600" fill="#1F7884">No media on disk, ever</text>
  <text x="496" y="301" font-size="11.5" fill="#1F7884">A slide sits in memory only while</text>
  <text x="496" y="317" font-size="11.5" fill="#1F7884">in flight, plus a cache of the last</text>
  <text x="496" y="333" font-size="11.5" fill="#1F7884">few slides. No volume is attached.</text>

  <text x="482" y="372" font-size="11.5" fill="#6B6480">Ten screens on one slide cost the</text>
  <text x="482" y="388" font-size="11.5" fill="#6B6480">presenter a single upload: the reply</text>
  <text x="482" y="404" font-size="11.5" fill="#6B6480">is fanned out to everyone waiting.</text>

  <!-- ── Viewers ─────────────────────────────────────────────────────────── -->
  <rect x="880" y="104" width="270" height="330" rx="18" fill="#FFFFFF" stroke="rgba(42,36,64,.12)"/>
  <rect x="880" y="104" width="270" height="5" rx="2.5" fill="#FDCA5C"/>
  <text x="902" y="138" font-size="16" font-weight="700" fill="#2A2440">Viewers</text>
  <text x="902" y="158" font-size="12.5" fill="#6B6480">as many as you like · no account</text>

  <rect x="902" y="180" width="96" height="60" rx="7" fill="#F1ECF6" stroke="rgba(42,36,64,.16)"/>
  <rect x="909" y="187" width="82" height="41" rx="4" fill="#FF8382"/>
  <rect x="938" y="240" width="24" height="8" fill="#DDD5E8"/>
  <rect x="922" y="248" width="56" height="6" rx="3" fill="#DDD5E8"/>
  <text x="950" y="272" text-anchor="middle" font-size="12" fill="#2A2440">Television</text>

  <rect x="1012" y="184" width="84" height="52" rx="6" fill="#F1ECF6" stroke="rgba(42,36,64,.16)"/>
  <rect x="1018" y="190" width="72" height="40" rx="4" fill="#FF8382"/>
  <path d="M1006 236 h96 l9 8 h-114 z" fill="#DDD5E8"/>
  <text x="1054" y="272" text-anchor="middle" font-size="12" fill="#2A2440">Laptop</text>

  <rect x="1110" y="180" width="34" height="62" rx="7" fill="#F1ECF6" stroke="rgba(42,36,64,.16)"/>
  <rect x="1115" y="187" width="24" height="48" rx="3" fill="#FF8382"/>
  <text x="1127" y="272" text-anchor="middle" font-size="12" fill="#2A2440">Phone</text>

  <rect x="902" y="292" width="226" height="64" rx="10" fill="#FFF4DE"/>
  <text x="916" y="312" font-size="12" font-weight="600" fill="#936A10">Chromecast</text>
  <text x="916" y="329" font-size="11.5" fill="#936A10">Found over mDNS on the local net;</text>
  <text x="916" y="345" font-size="11.5" fill="#936A10">the TV then loads /watch itself.</text>

  <text x="902" y="382" font-size="11.5" fill="#6B6480">Any browser will do, and nothing is</text>
  <text x="902" y="398" font-size="11.5" fill="#6B6480">installed. Every screen shows the same</text>
  <text x="902" y="414" font-size="11.5" fill="#6B6480">slide, because the presenter picks it.</text>

  <!-- ── Presenter ↔ server ──────────────────────────────────────────────── -->
  <line x1="310" y1="170" x2="460" y2="170" stroke="#936A10" stroke-width="2" marker-end="url(#arrow-auth)"/>
  <circle cx="322" cy="154" r="9" fill="#936A10"/><text x="322" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">1</text>
  <text x="398" y="158" text-anchor="middle" font-size="11.5" fill="#936A10">sign in</text>
  <text x="385" y="187" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">POST /api/auth/login</text>
  <text x="385" y="199" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">HTTPS · JSON</text>

  <line x1="310" y1="240" x2="460" y2="240" stroke="#1F7884" stroke-width="2" marker-end="url(#arrow-control)"/>
  <circle cx="322" cy="224" r="9" fill="#1F7884"/><text x="322" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">2</text>
  <text x="400" y="228" text-anchor="middle" font-size="11.5" fill="#1F7884">start sharing</text>
  <text x="385" y="257" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">POST /api/broadcast</text>
  <text x="385" y="269" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">→ code + password</text>

  <line x1="460" y1="310" x2="310" y2="310" stroke="#1F7884" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-control)"/>
  <circle cx="322" cy="294" r="9" fill="#1F7884"/><text x="322" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">4</text>
  <text x="404" y="298" text-anchor="middle" font-size="11.5" fill="#1F7884">“slide 4, please”</text>
  <text x="385" y="327" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">GET …/requests</text>
  <text x="385" y="339" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">held open ≤ 25s</text>

  <line x1="310" y1="380" x2="460" y2="380" stroke="#C8362F" stroke-width="3" marker-end="url(#arrow-media)"/>
  <circle cx="322" cy="364" r="9" fill="#C8362F"/><text x="322" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">5</text>
  <text x="402" y="368" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C8362F">the slide itself</text>
  <text x="385" y="397" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">PUT …/frame/:id</text>
  <text x="385" y="409" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">raw bytes · image/*</text>

  <!-- ── Server ↔ viewers ────────────────────────────────────────────────── -->
  <line x1="880" y1="170" x2="730" y2="170" stroke="#1F7884" stroke-width="2" marker-end="url(#arrow-control)"/>
  <circle cx="742" cy="154" r="9" fill="#1F7884"/><text x="742" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">3</text>
  <text x="820" y="158" text-anchor="middle" font-size="11.5" fill="#1F7884">join with code</text>
  <text x="805" y="187" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">POST /api/watch/join</text>
  <text x="805" y="199" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">JSON → viewer cookie</text>

  <line x1="880" y1="240" x2="730" y2="240" stroke="#1F7884" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-control)"/>
  <text x="814" y="228" text-anchor="middle" font-size="11.5" fill="#1F7884">“which slide?”</text>
  <text x="805" y="257" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">GET …/state?since=N</text>
  <text x="805" y="269" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">held open ≤ 25s</text>

  <line x1="730" y1="380" x2="880" y2="380" stroke="#C8362F" stroke-width="3" marker-end="url(#arrow-media)"/>
  <circle cx="742" cy="364" r="9" fill="#C8362F"/><text x="742" y="368" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">6</text>
  <text x="818" y="368" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C8362F">passed on</text>
  <text x="805" y="397" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">GET …/photo/:i</text>
  <text x="805" y="409" text-anchor="middle" font-size="9.5" class="mono" fill="#6B6480">raw bytes · no-store</text>

  <!-- ── Postgres ────────────────────────────────────────────────────────── -->
  <line x1="595" y1="434" x2="595" y2="486" stroke="#936A10" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-auth)"/>
  <text x="614" y="456" font-size="9.5" class="mono" fill="#6B6480">Postgres wire protocol · TCP</text>
  <text x="614" y="470" font-size="9.5" class="mono" fill="#6B6480">no TLS inside Railway's network</text>

  <ellipse cx="595" cy="506" rx="100" ry="17" fill="#FFFFFF" stroke="rgba(42,36,64,.12)"/>
  <path d="M495 506 v54 a100 17 0 0 0 200 0 v-54" fill="#FFFFFF" stroke="rgba(42,36,64,.12)"/>
  <text x="595" y="538" text-anchor="middle" font-size="14" font-weight="700" fill="#2A2440">Postgres</text>
  <text x="595" y="556" text-anchor="middle" font-size="11.5" fill="#6B6480">accounts + signing key only</text>

  <!-- ── Legend ──────────────────────────────────────────────────────────── -->
  <line x1="62" y1="480" x2="102" y2="480" stroke="#C8362F" stroke-width="3"/>
  <text x="112" y="484" font-size="12" fill="#6B6480">the pictures</text>

  <line x1="62" y1="506" x2="102" y2="506" stroke="#1F7884" stroke-width="2"/>
  <text x="112" y="510" font-size="12" fill="#6B6480">control — who is watching, which slide</text>

  <line x1="62" y1="532" x2="102" y2="532" stroke="#936A10" stroke-width="2"/>
  <text x="112" y="536" font-size="12" fill="#6B6480">accounts</text>

  <line x1="62" y1="558" x2="102" y2="558" stroke="#1F7884" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="112" y="562" font-size="12" fill="#6B6480">held open, answered when something changes</text>

  <!-- ── Transport ───────────────────────────────────────────────────────── -->
  <rect x="40" y="600" width="550" height="320" rx="14" fill="#FFFFFF" stroke="rgba(42,36,64,.1)"/>
  <text x="64" y="630" font-size="14" font-weight="700" fill="#2A2440">Transport</text>

  <text x="64" y="658" font-size="12" fill="#6B6480">Every hop between a browser and Vinboo is <tspan font-weight="600" fill="#2A2440">HTTPS</tspan>. Railway's</text>
  <text x="64" y="676" font-size="12" fill="#6B6480">edge terminates TLS and forwards to the app over HTTP/1.1.</text>

  <text x="64" y="706" font-size="12" fill="#6B6480">Slides travel as <tspan font-weight="600" fill="#2A2440">raw binary bodies</tspan> carrying their own type —</text>
  <text x="64" y="724" font-size="12" fill="#6B6480">image/jpeg, image/png, or image/svg+xml for PowerPoint.</text>
  <text x="64" y="742" font-size="12" fill="#6B6480">No base64, no re-encoding, no transcoding.</text>

  <text x="64" y="772" font-size="12" fill="#6B6480">Waiting is <tspan font-weight="600" fill="#2A2440">long-polling</tspan>: a GET is held open for up to 25</text>
  <text x="64" y="790" font-size="12" fill="#6B6480">seconds — 30 for a slide — and answered the instant</text>
  <text x="64" y="808" font-size="12" fill="#6B6480">something changes.</text>

  <text x="64" y="838" font-size="12" fill="#6B6480">The database hop speaks the <tspan font-weight="600" fill="#2A2440">Postgres wire protocol over TCP</tspan>.</text>
  <text x="64" y="856" font-size="12" fill="#6B6480">Inside Railway's private network it is unencrypted by design;</text>
  <text x="64" y="874" font-size="12" fill="#6B6480">TLS is used for any host outside it.</text>

  <text x="64" y="904" font-size="12" fill="#6B6480">Casting adds <tspan font-weight="600" fill="#2A2440">mDNS</tspan> discovery on the local network — then the</text>
  <text x="64" y="922" font-size="12" fill="#6B6480">TV fetches /watch over HTTPS on its own.</text>

  <!-- ── What it deliberately isn't ──────────────────────────────────────── -->
  <rect x="610" y="600" width="550" height="320" rx="14" fill="#FFFFFF" stroke="rgba(42,36,64,.1)"/>
  <text x="634" y="630" font-size="14" font-weight="700" fill="#2A2440">What it deliberately is not</text>

  <text x="634" y="658" font-size="12" fill="#6B6480"><tspan font-weight="600" fill="#2A2440">No WebSockets, no WebRTC.</tspan> Every exchange above is an</text>
  <text x="634" y="676" font-size="12" fill="#6B6480">ordinary HTTP request and response, which is why it survives</text>
  <text x="634" y="694" font-size="12" fill="#6B6480">corporate proxies and hotel Wi-Fi without special handling.</text>

  <text x="634" y="724" font-size="12" fill="#6B6480"><tspan font-weight="600" fill="#2A2440">Not a media stream.</tspan> Each slide is one complete file transfer,</text>
  <text x="634" y="742" font-size="12" fill="#6B6480">fetched when a screen needs it, not a continuous feed.</text>

  <text x="634" y="772" font-size="12" fill="#6B6480"><tspan font-weight="600" fill="#2A2440">Not peer-to-peer.</tspan> Viewers never contact the presenter directly,</text>
  <text x="634" y="790" font-size="12" fill="#6B6480">so no address of theirs is exposed and nothing has to be</text>
  <text x="634" y="808" font-size="12" fill="#6B6480">opened on a home router.</text>

  <rect x="634" y="830" width="502" height="72" rx="10" fill="#FFEDEC"/>
  <text x="650" y="852" font-size="12" font-weight="600" fill="#C8362F">Not end-to-end encrypted</text>
  <text x="650" y="870" font-size="11.5" fill="#C8362F">TLS protects each hop separately, so the server can read a</text>
  <text x="650" y="887" font-size="11.5" fill="#C8362F">slide during the moment it passes through.</text>
</svg>
